version: "2"

linters:
  enable:
    - dupl
    - errcheck
    - goconst
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unconvert
    - unused
  settings:
    gocyclo:
      min-complexity: 15
  exclusions:
    presets:
      - comments
      - std-error-handling
    paths:
      - internal/database # generated by sqlc
    rules:
      - path: _test\.go
        linters: [dupl, gosec, goconst]
      - path: store_(mem|pg)\.go
        text: "G404" # math/rand is fine for generating test data
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
